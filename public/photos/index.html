<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e83828">
  <meta name="description" content="Photographs from Japan. Click anywhere for the next frame.">
  <title>Japan - Photo Journal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='13' fill='%23e83828'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/tree-and-water.jpg" as="image">
  <link rel="stylesheet" href="style.css?v=3">
  <script src="photos.js?v=3" defer></script>
  <script src="app.js?v=3" defer></script>
</head>
<body>
  <main class="stage" id="stage">
    <button class="photograph" id="photograph" type="button" aria-label="Next photograph" aria-describedby="instructions"></button>
    <div class="marks" id="marks" aria-hidden="true"></div>
    <div class="site-links">
      <h1>What's going on!?</h1>
      <button class="text-link" id="clearMarks" type="button">Am I dreaming?</button>
    </div>
    <button class="text-link info" id="infoButton" type="button" aria-label="View the current photograph and information">info</button>
    <p class="sr-only" id="instructions">Click the photograph for the next frame and leave a symbol. Select Am I dreaming? to clear the symbols. Select info to view the complete photograph. Use the arrow keys to change photographs and Escape to close.</p>
    <div class="sr-only" id="status" role="status" aria-live="polite"></div>
  </main>

  <dialog class="viewer" id="viewer" aria-labelledby="viewerTitle">
    <img id="viewerImage" src="assets/tree-and-water.jpg" alt="">
    <div class="viewer-meta">
      <h2 id="viewerTitle"></h2>
      <p id="viewerDescription"></p>
      <a id="originalLink" href="assets/tree-and-water.jpg" target="_blank" rel="noopener">Open original ↗</a>
    </div>
    <button class="text-link close" id="closeViewer" type="button" aria-label="Close photograph">close</button>
    <button class="text-link previous" id="previousPhoto" type="button" aria-label="Previous photograph">←</button>
    <button class="text-link next" id="nextPhoto" type="button" aria-label="Next photograph">→</button>
  </dialog>
  <noscript><p class="no-script">Enable JavaScript to browse photographs. <a href="assets/tree-and-water.jpg">Open photograph</a></p></noscript>
</body>
</html>
