<text x="856" y="482" text-anchor="middle" font-family="'Geist Mono','PingFang SC','Noto Sans Mono CJK SC',monospace" font-size="12" fill="#4f5d75">执行结果</text>
<path d="M 512 496 L 336 496" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#d-02-agent-loop-arrow)"/>
<rect x="392.0" y="468" width="64" height="20" fill="#f5f5f5"/>
<text x="424" y="482" text-anchor="middle" font-family="'Geist Mono','PingFang SC','Noto Sans Mono CJK SC',monospace" font-size="12" fill="#4f5d75">更新状态</text>
<path d="M 208 448 L 208 304" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#d-02-agent-loop-arrow)" stroke-dasharray="5 4"/>
