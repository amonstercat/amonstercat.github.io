<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="02-agent-loop-title 02-agent-loop-desc" id="d-02-agent-loop-root">
<title id="02-agent-loop-title">Harness 怎样把一次调用变成任务循环</title>
<desc id="02-agent-loop-desc">运行框架在组装上下文、模型推理、输出路由、工具执行与记录之间循环，并按成功契约结束任务。</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-02-agent-loop-root { color: #2d3142; font-family: 'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif; }
      #d-02-agent-loop-root .diagram-container { width:100%;overflow-x:auto }
      #d-02-agent-loop-root .diagram-container { overflow-x:visible }</style>
<marker id="d-02-agent-loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="d-02-agent-loop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
<marker id="d-02-agent-loop-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="1280" height="720" fill="#f5f5f5"/>
<text x="48" y="72" font-size="40" font-family="'Instrument Serif','Songti SC','Noto Serif SC',serif" fill="#2d3142">Harness 怎样把一次调用变成任务循环</text>
<text x="48" y="112" font-size="12" font-family="'Geist Mono','PingFang SC','Noto Sans Mono CJK SC',monospace" fill="#4f5d75">AGENT RUNTIME · 02 / 10 · CONCEPTUAL ENGINEERING DIAGRAM</text>
<path d="M 336 256 L 512 256" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#d-02-agent-loop-arrow-link)"/>
