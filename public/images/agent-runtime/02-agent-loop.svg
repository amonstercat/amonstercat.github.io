<text x="168.0" y="380" text-anchor="middle" font-family="'Geist Mono','PingFang SC','Noto Sans Mono CJK SC',monospace" font-size="12" fill="#4f5d75">仍需继续</text>
<rect x="80" y="208" width="256" height="96" rx="6" fill="#f5f5f5"/>
<rect x="80" y="208" width="256" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
<text x="208.0" y="252.0" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#2d3142">组装上下文</text>
<text x="208.0" y="280.0" text-anchor="middle" font-family="'Geist Mono','PingFang SC','Noto Sans Mono CJK SC',monospace" font-size="12" fill="#4f5d75">指令、历史、工具说明</text>
<rect x="512" y="208" width="256" height="96" rx="6" fill="#f5f5f5"/>
<rect x="512" y="208" width="256" height="96" rx="6" fill="#f6e9e2" stroke="#eb6c36" stroke-width="1.2"/>
<text x="640.0" y="252.0" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#2d3142">请求模型推理</text>
<text x="640.0" y="280.0" text-anchor="middle" font-family="'Geist Mono','PingFang SC','Noto Sans Mono CJK SC',monospace" font-size="12" fill="#4f5d75">生成回答或调用请求</text>
<rect x="944" y="208" width="256" height="96" rx="6" fill="#f5f5f5"/>
<rect x="944" y="208" width="256" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
<text x="1072.0" y="252.0" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#2d3142">识别输出类型</text>
<text x="1072.0" y="280.0" text-anchor="middle" font-family="'Geist Mono','PingFang SC','Noto Sans Mono CJK SC',monospace" font-size="12" fill="#4f5d75">message / tool call</text>
<rect x="944" y="448" width="256" height="96" rx="6" fill="#f5f5f5"/>
<rect x="944" y="448" width="256" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
<text x="1072.0" y="492.0" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#2d3142">校验并执行工具</text>
<text x="1072.0" y="520.0" text-anchor="middle" font-family="'Geist Mono','PingFang SC','Noto Sans Mono CJK SC',monospace" font-size="12" fill="#4f5d75">名称、参数、权限</text>
<rect x="512" y="448" width="256" height="96" rx="6" fill="#f5f5f5"/>
<rect x="512" y="448" width="256" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
<text x="640.0" y="492.0" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#2d3142">保存工具结果</text>
<text x="640.0" y="520.0" text-anchor="middle" font-family="'Geist Mono','PingFang SC','Noto Sans Mono CJK SC',monospace" font-size="12" fill="#4f5d75">对应 call_id 与状态</text>
<rect x="80" y="448" width="256" height="96" rx="6" fill="#f5f5f5"/>
<rect x="80" y="448" width="256" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
<text x="208.0" y="492.0" text-anchor="middle" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#2d3142">判断继续或结束</text>
<text x="208.0" y="520.0" text-anchor="middle" font-family="'Geist Mono','PingFang SC','Noto Sans Mono CJK SC',monospace" font-size="12" fill="#4f5d75">成功契约、错误与预算</text>
<text x="80" y="616" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#4f5d75">已有最终回答且满足任务要求时结束；模型请求工具不等于工具已经执行。</text>
<line x1="48" y1="652" x2="1232" y2="652" stroke="#bfc0c0"/>
<text x="48" y="684" font-size="12" font-family="'Geist Mono','PingFang SC','Noto Sans Mono CJK SC',monospace" fill="#4f5d75">实线：请求 / 状态流转　　虚线：结果 / 可选传递　　橙色：本图关注点</text>
