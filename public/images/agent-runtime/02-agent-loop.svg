<text x="856" y="242" text-anchor="middle" font-family="'Geist Mono','PingFang SC','Noto Sans Mono CJK SC',monospace" font-size="12" fill="#4f5d75">结构化输出</text>
<path d="M 1072 304 L 1072 448" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#d-02-agent-loop-arrow)"/>
<rect x="1080.0" y="366" width="64" height="20" fill="#f5f5f5"/>
<text x="1112.0" y="380" text-anchor="middle" font-family="'Geist Mono','PingFang SC','Noto Sans Mono CJK SC',monospace" font-size="12" fill="#4f5d75">需要工具</text>
