<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent 运行机制图集</title><style>body{margin:0;background:#f5f5f5;color:#2d3142;font-family:system-ui,"PingFang SC",sans-serif}main{max-width:1280px;margin:auto;padding:24px}figure{margin:0 0 48px}img{width:100%;height:auto}a{color:#2e5aa8}p{line-height:1.8}</style><main><h1>Agent 运行机制：十张工程图</h1><p>图形使用原生 Draw.io 节点与连线，可打开源文件继续编辑。图集按灰橙色方案制作；浏览器可直接查看 SVG。</p><p><a href="/downloads/agent-runtime-diagrams.drawio">下载多页 Draw.io 源文件</a></p><figure><a href="01-agent-deployment.html"><img src="01-agent-deployment.svg" alt="本机运行框架组织状态并执行本地工具，远端服务处理模型推理；本地持久化不等于远端从未处理相关数据。"></a><figcaption><b>Agent 的本机与远端部署边界</b><p>本机运行框架组织状态并执行本地工具，远端服务处理模型推理；本地持久化不等于远端从未处理相关数据。</p></figcaption></figure><figure><a href="02-agent-loop.html"><img src="02-agent-loop.svg" alt="运行框架在组装上下文、模型推理、输出路由、工具执行与记录之间循环，并按成功契约结束任务。"></a><figcaption><b>Harness 怎样把一次调用变成任务循环</b><p>运行框架在组装上下文、模型推理、输出路由、工具执行与记录之间循环，并按成功契约结束任务。</p></figcaption></figure><figure><a href="03-context-lifecycle.html"><img src="03-context-lifecycle.svg" alt="持久化记录被选取和组织后成为本轮输入，再在推理服务中转换为模型可处理的表示。"></a><figcaption><b>上下文的三种实际形态</b><p>持久化记录被选取和组织后成为本轮输入，再在推理服务中转换为模型可处理的表示。</p></figcaption></figure><figure><a href="04-compaction-memory.html"><img src="04-compaction-memory.svg" alt="压缩为当前会话续接腾出空间；长期记忆从符合条件的旧会话中提取未来可复用的信息。"></a><figcaption><b>上下文压缩与长期记忆是两条流程</b><p>压缩为当前会话续接腾出空间；长期记忆从符合条件的旧会话中提取未来可复用的信息。</p></figcaption></figure><figure><a href="05-function-call-sequence.html"><img src="05-function-call-sequence.svg" alt="模型生成调用请求后，由执行环境落实操作；实际结果返回模型后，模型才能继续依据结果作答。"></a><figcaption><b>Function Calling 的请求与执行时序</b><p>模型生成调用请求后，由执行环境落实操作；实际结果返回模型后，模型才能继续依据结果作答。</p></figcaption></figure><figure><a href="06-mcp-bridge.html"><img src="06-mcp-bridge.svg" alt="模型表达工具调用意图，运行框架中的 MCP 客户端连接工具服务，服务再访问实际业务系统。"></a><figcaption><b>Function Call 与 MCP 分别位于哪一层</b><p>模型表达工具调用意图，运行框架中的 MCP 客户端连接工具服务，服务再访问实际业务系统。</p></figcaption></figure><figure><a href="07-cli-mcp-skill.html"><img src="07-cli-mcp-skill.svg" alt="Skill 提供完成任务的方法，Function Calling 表达调用请求，Harness 可以接 MCP、CLI 或直接 HTTP 实现。"></a><figcaption><b>同一个任务可以接入不同工具入口</b><p>Skill 提供完成任务的方法，Function Calling 表达调用请求，Harness 可以接 MCP、CLI 或直接 HTTP 实现。</p></figcaption></figure><figure><a href="08-subagent-fork-join.html"><img src="08-subagent-fork-join.svg" alt="子任务可以与主任务独立工作重叠，但依赖结果的后续步骤必须等待相应任务完成。"></a><figcaption><b>主子 Agent 的分派、并行与汇合</b><p>子任务可以与主任务独立工作重叠，但依赖结果的后续步骤必须等待相应任务完成。</p></figcaption></figure><figure><a href="09-context-isolation.html"><img src="09-context-isolation.svg" alt="父对话快照可以成为多个任务的起点，之后各自累积上下文，必要信息经消息或结果回传。"></a><figcaption><b>上下文独立维护，文件可以共享</b><p>父对话快照可以成为多个任务的起点，之后各自累积上下文，必要信息经消息或结果回传。</p></figcaption></figure><figure><a href="10-customer-service-workflow.html"><img src="10-customer-service-workflow.svg" alt="模型分析证据并提出方案，退款等业务写入须经过确定性规则、审批和幂等执行，最后核验真实结果。"></a><figcaption><b>客服 Agent 的建议与执行边界</b><p>模型分析证据并提出方案，退款等业务写入须经过确定性规则、审批和幂等执行，最后核验真实结果。</p></figcaption></figure></main></html>
